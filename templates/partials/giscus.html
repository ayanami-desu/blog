{% if config.extra.giscus_repo_id and page.date %}
<section class="comments">
  <h2>评论</h2>
  <script src="https://giscus.app/client.js"
          data-repo="{{ config.extra.giscus_repo }}"
          data-repo-id="{{ config.extra.giscus_repo_id }}"
          data-category="{{ config.extra.giscus_category }}"
          data-category-id="{{ config.extra.giscus_category_id }}"
          data-mapping="{% if page.extra.comments %}specific{% else %}pathname{% endif %}"
          {% if page.extra.comments %}data-term="{{ page.extra.comments }}"{% endif %}
          data-strict="1"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="preferred_color_scheme"
          data-lang="zh-CN"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
  <noscript>评论区由 giscus 提供，需要启用 JavaScript。</noscript>
</section>
{% endif %}
